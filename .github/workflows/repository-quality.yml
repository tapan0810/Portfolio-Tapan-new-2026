name: Repository Quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend when present
        shell: bash
        run: |
          for file in $(find . -name package.json -not -path '*/node_modules/*'); do dir=$(dirname "$file"); cd "$dir" && npm ci && npm run build --if-present && npm test --if-present -- --watch=false; cd - >/dev/null; done
